
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cold Chain Monitoring</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f1ff, #f4f7fb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #17365d;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #245184;
        }

        .message {
            text-align: center;
            color: #d93025;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #17365d;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Reset your password using your recovery code.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/forgot-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter registered email" required>

            <label>Recovery Code</label>
            <input type="text" name="recovery_code"
                   placeholder="Enter your recovery code" required>

            <label>New Password</label>
            <input type="password" name="new_password"
                   placeholder="Enter new password"
                   minlength="8" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm new password"
                   minlength="8" required>

            <button type="submit">Reset Password</button>

        </form>

        <p class="login-link">
            Remember your password?
            <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
